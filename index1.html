<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>希望樹生長曲線產生器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f8fbff;
      --card: #ffffff;
      --accent: #3fb0ff;
      --muted: #6b6f76;
      --c1: #ff9aa2; --c2: #ffd3b6; --c3: #ffecb3; --c4: #c3f0ca; --c5: #9ad0ff; --c6: #d7b6ff; --c7: #ffb3e6;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 18px;
      background: var(--bg);
      color: #123;
      /* 關鍵：讓 body 不要限制寬度 */
      display: inline-block;
      min-width: 100%;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 18px rgba(12,30,50,0.06);
      /* 關鍵修正：改為 fit-content，讓白底跟著最寬的表格走 */
      width: fit-content;
      min-width: 900px; /* 確保基本寬度 */
      box-sizing: border-box;
      display: block;
    }

    h1 { font-size: 20px; margin: 0 0 8px; }
    label { display: block; margin-top: 8px; font-size: 13px; color: var(--muted); }
    input, select, button { padding: 8px 10px; font-size: 14px; border-radius: 8px; border: 1px solid #e6eef9; }
    
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    /* 表格維持原始狀態，不強制收縮 */
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #eef6ff; padding: 8px; text-align: left; white-space: nowrap; }
    
    .small { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .btn { padding: 8px 12px; border: 0; background: var(--accent); color: #fff; border-radius: 8px; cursor: pointer; }
    .btn.secondary { background: #9aa6b2; }

    /* 圖表區塊同步寬度 */
    #chartWrap {
      background: linear-gradient(180deg, #ffffff, #f7fbff);
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      width: 100%;
    }
    
    /* 曲線圖維持固定寬度，對齊上方的測量記錄表格 */
    canvas { 
      width: 900px !important; 
      height: 560px !important; 
    }

    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .legend-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .dot { width: 14px; height: 14px; border-radius: 4px; }
    
    #analysis {
      margin-top: 12px;
      border-radius: 10px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 4px 12px rgba(12,30,50,0.04);
      /* 分析表也會跟著整體寬度撐開 */
      width: 100%;
    }
    #analysis table { width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h1>希望樹生長曲線產生器</h1>
    <p class="small">0–17 歲 • 同圖可切換身高/體重。系統會自動計算年齡、BMI、各項百分位及年增長速度。</p>

    <div class="row">
      <div>
        <label>性別</label>
        <select id="sex"><option value="M">男</option><option value="F">女</option></select>
      </div>
      <div>
        <label>出生年月日</label>
        <input id="birthdate" type="date" />
      </div>

      <tbody></tbody>

    <div class="row" style="margin-top:8px">
      <button id="addRow" class="btn">＋ 添加測量資料</button>
      <button id="clearRows" class="btn secondary">清除所有</button>
      <div style="flex:1"></div>
      <label>顯示：</label>
      <select id="viewMetric">
        <option value="height">身高曲線</option>
        <option value="weight">體重曲線</option>
      </select>
      <button id="btnDraw" class="btn">產生圖表</button>
      <button id="btnExport" class="btn">匯出 PNG</button>
    </div>

    <div id="chartWrap">
      <canvas id="chart"></canvas>
      <div id="legend" class="legend"></div>
    </div>

    <div id="analysis">

          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

      P97: [52.7,70.0,78.9,86.2,92.5,97.3,102.2,106.7,110.8,114.7,118.4,121.3,124.2,127.2,130.1,136.5,143.5,150.8,157.3,161.8,164.8,167.0,168.2,168.8,169.0]

  weight: {

      P25: [3.0,7.4,9.0,10.1,11.3,12.3,13.2,14.1,15.0,15.9,16.7,17.9,19.0,20.2,21.3,23.8,26.0,28.4,31.4,35.2,40.7,46.8,51.3,54.1,56.1],
      P50: [3.3,7.9,9.6,10.9,12.2,13.3,14.3,15.3,16.3,17.3,18.3,19.6,20.9,22.3,23.6,26.3,28.8,31.5,35.3,40.3,46.5,52.5,56.5,59.0,61.0],
      P75: [3.7,8.5,10.4,11.8,13.1,14.4,15.6,16.7,17.8,19.0,20.1,21.6,23.2,24.7,26.3,29.6,32.7,36.0,40.8,46.5,53.0,58.7,62.5,65.0,66.6],
      P85: [3.9,8.9,10.8,12.3,13.7,15.0,16.3,17.5,18.7,19.9,21.1,22.9,24.7,26.4,28.2,32.2,35.7,39.4,44.7,50.4,56.8,62.7,66.5,69.0,70.0],
      P97: [4.3,9.7,11.8,13.5,15.1,16.6,18.0,19.4,20.9,22.3,23.8,26.5,29.2,32.0,34.7,40.2,44.3,48.6,54.8,61.5,68.5,74.3,77.6,79.3,80.0]
    },

      P50: [3.2,7.3,8.9,10.2,11.5,12.7,13.9,15.0,16.1,17.2,18.2,19.4,20.5,21.7,22.8,25.4,28.2,31.8,36.9,41.7,45.4,48.1,49.6,50.5,51.0],
      P75: [3.6,7.9,9.7,11.1,12.5,13.8,15.1,16.4,17.7,18.9,20.2,21.5,22.8,24.0,25.3,28.4,32.1,36.7,42.2,47.0,50.5,53.0,54.5,55.0,55.0],
      P85: [3.7,8.3,10.2,11.6,13.1,14.5,15.9,17.3,18.6,20.0,21.3,22.7,24.2,25.6,27.1,30.8,35.0,39.8,45.5,50.1,53.5,56.0,57.5,58.0,58.0],
      P97: [4.2,9.2,11.3,13.0,14.6,16.2,17.8,19.5,21.1,22.8,24.4,26.5,28.6,30.8,32.9,37.8,42.8,47.3,52.7,57.8,61.2,63.9,65.5,66.2,66.7]
    }
  },
  bmi: { M: {}, F: {} }
};

const pctColors = ['#ff9aa2','#ffd3b6','#ffecb3','#c3f0ca','#9ad0ff','#d7b6ff','#ffb3e6'];
const pctOrder = ['P3','P15','P25','P50','P75','P85','P97'];

function ageInYears(birthIso, measureIso){
  const b=new Date(birthIso); const m=new Date(measureIso);
  return (m - b) / (1000*60*60*24*365.25);
}
function formatAgeYears(v){ if(isNaN(v)) return '-'; const yrs=Math.floor(v); const months=Math.round((v-yrs)*12); return `${yrs}y ${months}m (${v.toFixed(2)} yr)`; }

const tbody = document.querySelector('#measTable tbody');
const addRowBtn = document.getElementById('addRow');
const clearBtn = document.getElementById('clearRows');
const drawBtn = document.getElementById('btnDraw');
const exportBtn = document.getElementById('btnExport');
const metricSelect = document.getElementById('viewMetric');
const legendDiv = document.getElementById('legend');
const analysisTbody = document.querySelector('#analysisTable tbody');

function buildLegend(){ legendDiv.innerHTML=''; pctOrder.forEach((k,i)=>{ const it=document.createElement('div'); it.className='legend-item'; it.innerHTML=`<div class='dot' style='background:${pctColors[i]}'></div><div>${k}</div>`; legendDiv.appendChild(it); }); }
buildLegend();

function addRow(date='',h='',w=''){
  const rows = tbody.querySelectorAll('tr').length;
  if(rows>=10){ alert('最多 10 筆'); return; }
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${rows+1}</td>
    <td><input type="date" class="md-date" value="${date}"></td>
    <td><input type="number" step="0.1" class="md-h" value="${h}" placeholder="cm"></td>
    <td><input type="number" step="0.1" class="md-w" value="${w}" placeholder="kg"></td>
    <td><button class="btn secondary btn-del">刪除</button></td>`;
  tbody.appendChild(tr);
  const del = tr.querySelector('.btn-del');
  del.addEventListener('click', ()=>{ tr.remove(); reorderRows(); updateAnalysisTable(); });
  tr.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', ()=> updateAnalysisTable()));
}
addRowBtn.addEventListener('click', ()=> addRow());
clearBtn.addEventListener('click', ()=>{ if(confirm('確定要清除所有測量資料？')){ tbody.innerHTML=''; updateAnalysisTable(); } });

function reorderRows(){ tbody.querySelectorAll('tr').forEach((tr,i)=> tr.cells[0].innerText = i+1); }

function interpArrayLinear(xSrc, ySrc, xTarget){
  if(!Array.isArray(xSrc) || !Array.isArray(ySrc) || xSrc.length!==ySrc.length) { xSrc = ySrc.map((_,i)=>i); }
  return xTarget.map(x=>{
    if(x <= xSrc[0]) { if(xSrc.length>1){ const x0=xSrc[0], x1=xSrc[1], y0=ySrc[0], y1=ySrc[1]; const t=(x-x0)/(x1-x0||1); return y0 + t*(y1-y0); } return ySrc[0]; }
    if(x >= xSrc[xSrc.length-1]) { if(xSrc.length>1){ const n=xSrc.length; const x0=xSrc[n-2], x1=xSrc[n-1], y0=ySrc[n-2], y1=ySrc[n-1]; const t=(x-x0)/(x1-x0||1); return y0 + t*(y1-y0); } return ySrc[ySrc.length-1]; }
    for(let i=0;i<xSrc.length-1;i++){ const x0=xSrc[i], x1=xSrc[i+1]; if(x >= x0 && x <= x1){ const y0=ySrc[i], y1=ySrc[i+1]; const t=(x-x0)/(x1-x0||1); return y0 + t*(y1-y0); } } return NaN;
  });
}

function drawChart(metric){
  const sex = document.getElementById('sex').value;
  const agesSrc = embeddedData.agesSrc;
  const datasets = [];
  pctOrder.forEach((pk, idx)=>{
    const arr = (embeddedData[metric] && embeddedData[metric][sex] && embeddedData[metric][sex][pk]) || null;
    if(!arr) return;
    const yInterp = interpArrayLinear(agesSrc, arr, Array.from({length: 35}, (_,i)=> +(i*0.5).toFixed(1)));
    datasets.push({ label: pk, data: Array.from({length: 35}, (_,i)=> +(i*0.5).toFixed(1)).map((a,i)=> ({ x:a, y: +yInterp[i].toFixed(2) })), borderColor: pctColors[idx], borderWidth: pk==='P50'?2:1, pointRadius:0, fill:false, tension:0.25, borderDash: pk==='P50'?[]:[6,4] });
  });
  const birth = document.getElementById('birthdate').value;
  const rows = Array.from(tbody.querySelectorAll('tr')).map(tr=>{ const d = tr.querySelector('.md-date').value; if(!d) return null; const h = parseFloat(tr.querySelector('.md-h').value); const w = parseFloat(tr.querySelector('.md-w').value); const age = ageInYears(birth,d); return { date:d, age: +(age.toFixed(2)), height: h, weight: w }; }).filter(r=>r && !isNaN(r.age) && (r.height || r.weight));
  const userPts = rows.map(r=> ({ x: r.age, y: metric==='height'? r.height: r.weight, meta: r }));
  datasets.push({ label:'測量點', data:userPts, borderColor:'#333', backgroundColor:'#333', pointRadius:4, showLine:false });
  const allY=[]; datasets.forEach(ds=> ds.data.forEach(pt=> { if(pt && pt.y!=null && !isNaN(pt.y)) allY.push(pt.y); }));
  const yMin = metric==='height'? 80 : Math.floor(Math.min(...allY.filter(v=>isFinite(v))) - 2);
  const yMax = Math.ceil(Math.max(...allY.filter(v=>isFinite(v))) + 5);
  const ctx = document.getElementById('chart').getContext('2d');
  if(window.growthChart) window.growthChart.destroy();
  window.growthChart = new Chart(ctx, { type:'line', data:{ datasets }, options:{ responsive:false, maintainAspectRatio:false, scales:{ x:{ type:'linear', min:0, max:17, ticks:{ stepSize:1 } }, y:{ min: yMin, max: yMax } }, plugins:{ legend:{ display:false } } } });
  updateAnalysisTable();
}

function approximatePercentileInterpolated(metric, sex, age, value){
  const availableKeys = Object.keys((embeddedData[metric] && embeddedData[metric][sex]) || {});
  if(availableKeys.length === 0) return NaN;
  const pnums = [3,15,25,50,75,85,97];
  const vals = pctOrder.map(pk=>{ const arr = embeddedData[metric][sex][pk]; return interpArrayLinear(embeddedData.agesSrc, arr, [age])[0]; });
  for(let i=0;i<vals.length-1;i++){ if(value>=vals[i] && value<=vals[i+1]){ return pnums[i] + (value-vals[i])/(vals[i+1]-vals[i])*(pnums[i+1]-pnums[i]); } }
  return value < vals[0] ? 1.5 : 98.5;
}

function computeBMIandPercentile(age, sex, height_cm, weight_kg){
  const bmi = weight_kg / Math.pow(height_cm/100, 2);
  const hP50 = interpArrayLinear(embeddedData.agesSrc, embeddedData.height[sex]['P50'], [age])[0];
  const vals = pctOrder.map(pk => { const w = interpArrayLinear(embeddedData.agesSrc, embeddedData.weight[sex][pk], [age])[0]; return w / Math.pow(hP50/100, 2); });
  const pnums = [3,15,25,50,75,85,97];
  for(let i=0;i<vals.length-1;i++){ if(bmi>=vals[i] && bmi<=vals[i+1]){ return { bmi, bmiPct: pnums[i] + (bmi-vals[i])/(vals[i+1]-vals[i])*(pnums[i+1]-pnums[i]) }; } }
  return { bmi, bmiPct: bmi < vals[0] ? 1.5 : 98.5 };
}

function updateAnalysisTable(){
  analysisTbody.innerHTML = '';
  const birth = document.getElementById('birthdate').value;
  const sex = document.getElementById('sex').value;
  const rows = Array.from(tbody.querySelectorAll('tr')).map(tr=>{ const d = tr.querySelector('.md-date').value; if(!d) return null; const h = parseFloat(tr.querySelector('.md-h').value); const w = parseFloat(tr.querySelector('.md-w').value); const age = ageInYears(birth,d); return { date:d, age: +(age.toFixed(2)), height: h, weight: w }; }).filter(r=>r);
  rows.sort((a, b) => new Date(a.date) - new Date(b.date));
  const finalRows = rows.map((r, i) => {
    let gr = '-'; if (i > 0) { const hD = r.height - rows[i-1].height; const aD = r.age - rows[i-1].age; if (aD > 0) gr = (hD/aD).toFixed(1); }
    const hP = approximatePercentileInterpolated('height', sex, r.age, r.height);
    const wP = approximatePercentileInterpolated('weight', sex, r.age, r.weight);
    const bO = computeBMIandPercentile(r.age, sex, r.height, r.weight);
    return { ...r, hP, wP, b: bO.bmi, bP: bO.bmiPct, gr };
  });
  finalRows.reverse().forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.date}</td><td>${formatAgeYears(r.age)}</td><td>${r.height.toFixed(1)}</td><td>${r.hP.toFixed(1)}th</td><td>${r.weight.toFixed(1)}</td><td>${r.wP.toFixed(1)}th</td><td>${r.b.toFixed(1)}</td><td>${r.bP.toFixed(1)}th</td><td style="color:#2c7be5; font-weight:bold;">${r.gr}</td>`;
    analysisTbody.appendChild(tr);
  });
}

drawBtn.addEventListener('click', ()=> drawChart(metricSelect.value));
exportBtn.addEventListener('click', ()=>{ 
    const canvas = document.getElementById('chart');
    const a = document.createElement('a'); a.href = canvas.toDataURL(); a.download = 'growth.png'; a.click(); 
});
addRow();
</script>
